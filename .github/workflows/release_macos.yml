name: Release macOS

# A draft: the signed, notarized Mac app for a v* tag, attached to the same
# GitHub release as the iOS app. It needs a paid Apple Developer account and
# these repository secrets (Settings → Secrets and variables → Actions):
#
#   MACOS_CERTIFICATE_P12      base64 of the "Developer ID Application" certificate and key (.p12)
#   MACOS_CERTIFICATE_PASSWORD the .p12's password
#   MACOS_TEAM_ID              the 10-character team ID
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8, role Developer)
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           the issuer ID shown above the keys
#
# Without MACOS_CERTIFICATE_P12 the job skips itself, so tags still release iOS.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Signed and notarized Mac app
    runs-on: macos-26
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - name: Skip without signing secrets
        if: env.HAS_CERTIFICATE != 'true'
        run: echo "::notice::No MACOS_CERTIFICATE_P12 secret, so no Mac build."

      - uses: actions/checkout@v4
        if: env.HAS_CERTIFICATE == 'true'

      - name: Disable Swift macro plugin consent prompt
        if: env.HAS_CERTIFICATE == 'true'
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Keychain with the Developer ID certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Archive
        if: env.HAS_CERTIFICATE == 'true'
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          xcodebuild -workspace Aicord.xcworkspace -scheme Aicord -configuration Release \
            -destination 'generic/platform=macOS' -archivePath build/Aicord.xcarchive \
            -skipMacroValidation -skipPackagePluginValidation \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION='${{ github.run_number }}' \
            DEVELOPMENT_TEAM='${{ secrets.MACOS_TEAM_ID }}' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Developer ID Application' \
            OTHER_CODE_SIGN_FLAGS='--timestamp --options=runtime' \
            archive | tail -20

      - name: Export with Developer ID
        if: env.HAS_CERTIFICATE == 'true'
        run: |
          cat > build/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${{ secrets.MACOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Aicord.xcarchive \
            -exportOptionsPlist build/export.plist -exportPath build/export

      - name: Notarize and staple
        if: env.HAS_CERTIFICATE == 'true'
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          app=build/export/Aicord.app
          ditto -c -k --keepParent "$app" build/notarize.zip
          xcrun notarytool submit build/notarize.zip --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id '${{ secrets.NOTARY_KEY_ID }}' \
            --issuer '${{ secrets.NOTARY_ISSUER_ID }}'
          xcrun stapler staple "$app"
          rm "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$app" "Aicord-${GITHUB_REF_NAME#v}-mac.zip"

      - name: Attach to the release
        if: env.HAS_CERTIFICATE == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the iOS workflow creates the release; wait for it if it's still building
          for _ in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" Aicord-*-mac.zip --clobber

      - name: Remove the keychain
        if: always() && env.HAS_CERTIFICATE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

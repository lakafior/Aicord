name: Release

# A tag like v0.2.0 builds an unsigned iOS app (.ipa) for AltStore and
# SideStore and attaches it to a GitHub release. The signed Mac app is in
# release_macos.yml, the AltStore source on GitHub Pages in altstore.yml.
#
# Assets keep the same names in every release (Aicord.ipa, Aicord-mac.zip), so
# the README links to releases/latest/download/... stay valid.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Unsigned iOS app
    runs-on: xcode-27  # macos-26 has no Xcode 27; this image is a public preview
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 27
        # the app uses the iOS and macOS 27 SDKs: the image's default Xcode 27
        run: |
          xcodebuild -version

      - name: Disable Swift macro plugin consent prompt
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Force Git to use HTTPS
        # DaveKit's submodules point at git@github.com:, and the runner has no SSH key
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # workflow_dispatch from a branch: a version that can't be mistaken for a release
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="0.0.0-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild -workspace Aicord.xcworkspace \
            -scheme Aicord \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            MARKETING_VERSION='${{ steps.version.outputs.version }}' \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-ios.log 2>&1 \
            || { grep -E 'error:|\*\* BUILD' build-ios.log; exit 1; }
          grep -E '\*\* BUILD' build-ios.log

      - name: Package .ipa
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Aicord.app ipa/Payload/
          (cd ipa && zip -qry ../Aicord.ipa Payload)
          ls -l Aicord.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: Aicord.ipa

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-log
          path: build-ios.log

  release:
    name: GitHub release
    needs: ios
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ipa

      - name: Release notes from CHANGELOG.md
        run: |
          # the changelog's newest section, up to the next "## " heading
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          {
            echo
            echo "**Install on iPhone:** add the AltStore or SideStore source from"
            echo "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Aicord ${{ needs.ios.outputs.version }}" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" Aicord.ipa --clobber

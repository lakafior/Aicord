name: AltStore source

# Publishes the AltStore / SideStore source (altstore.json, built from every
# release with an .ipa) and its page (.github/pages) on GitHub Pages. Runs after
# a release build, when the page or the source script changes, and by hand.
#
# Settings → Pages → Source: GitHub Actions. workflow_run always runs on the
# default branch, so the github-pages environment only needs to allow main.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: [scripts/altstore_source.py, .github/pages/**, .github/workflows/altstore.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: AltStore source on Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the source from all releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          cp -R .github/pages/. site/
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            | python3 scripts/altstore_source.py > site/altstore.json
          python3 -m json.tool site/altstore.json > /dev/null

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
